<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="canonical" href="{% block canonical %}{{ config.base_url }}{% endblock canonical %}">
  <meta name="theme-color" content="#17171a">
  <!-- Social metadata: this site is pasted into chat mid-conversation, so the
       preview card carries the argument, not just the domain. -->
  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:type" content="{% if page and page.date %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page %}{{ page.title }}{% elif section %}{{ section.title }}{% else %}{{ config.title }}{% endif %}">
  <meta property="og:description" content="{% if page %}{{ page.description | default(value=config.description) }}{% elif section %}{{ section.description | default(value=config.description) }}{% else %}{{ config.description }}{% endif %}">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) }}">
  <meta property="og:image" content="{{ config.base_url }}/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="journey.pm — Every journey starts with a conversation. Every conversation ends as a record.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page %}{{ page.title }}{% elif section %}{{ section.title }}{% else %}{{ config.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page %}{{ page.description | default(value=config.description) }}{% elif section %}{{ section.description | default(value=config.description) }}{% else %}{{ config.description }}{% endif %}">
  <meta name="twitter:image" content="{{ config.base_url }}/og.png">
  {% if page and page.date %}<meta property="article:published_time" content="{{ page.date | date(format="%Y-%m-%d") }}">{% endif %}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="journey.pm — home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="9" cy="23" r="4" fill="none" stroke="currentColor" stroke-width="2.5"></circle>
        <path d="M9 19 C9 6, 28 6, 28 14 C28 20, 22 23, 13 23" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
      </svg>
      <span>journey<span style="color: var(--accent)">.pm</span></span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="/methodology/">Model</a>
      <a href="/deliberation/">Deliberation</a>
      <a href="/invariants/">Invariants</a>
      <a href="/comparisons/">Comparisons</a>
      <a href="/glossary/">Glossary</a>
      <a href="/blog/">Blog</a>
      <a href="/about/">About</a>
    </nav>
  </header>
  <main id="main" class="site-main">
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer">
    <p>
      <span>Content <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · code <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0-or-later</a></span>
      <span><a href="/atom.xml">Atom</a></span>
      <span><a href="https://github.com/bachp/journey">source on GitHub</a></span>
    </p>
  </footer>
</body>
</html>
