# Codeberg Pages deploy for journey.pm.
# Builds with Zola 0.22 (pinned) and deploys via the official git-pages
# action. Pushes to main only — draft branches would otherwise publish.
#
# Custom-domain deploy (first deploy): the `server` parameter is REQUIRED —
# git-pages will not issue a TLS certificate unless a site exists on the
# domain, but contacting the domain over HTTPS needs that certificate.
# `server: codeberg.page` breaks the loop by passing the domain in the
# Host: header instead. Keep it permanently.

name: Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny
    container:
      image: ghcr.io/getzola/zola:v0.22.1
      entrypoint: [""]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: zola build

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://journey.pm/
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: public
